<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">小六壬 · 白瓷六宫盘</title>
<desc id="desc">暖灰纸白背景上的俯视白瓷六宫盘，六宫顺序为大安、留连、速喜、赤口、小吉、空亡，中心为青绿指针。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f4f2ec"/><stop offset=".54" stop-color="#eeeee8"/><stop offset="1" stop-color="#e5e6de"/></linearGradient>
  <radialGradient id="paperlight" cx="29%" cy="18%" r="82%"><stop stop-color="#fffef9" stop-opacity=".7"/><stop offset="1" stop-color="#fffef9" stop-opacity="0"/></radialGradient>
  <linearGradient id="porcelain-edge" x1=".08" y1="0" x2=".83" y2="1"><stop stop-color="#fffffa"/><stop offset=".42" stop-color="#edeee8"/><stop offset=".73" stop-color="#d6dbd1"/><stop offset="1" stop-color="#cbd0c6"/></linearGradient>
  <linearGradient id="lip" x1=".22" y1="0" x2=".7" y2="1"><stop stop-color="#fffffd"/><stop offset=".44" stop-color="#f7f8f2"/><stop offset="1" stop-color="#e9ece3"/></linearGradient>
  <radialGradient id="bowl" cx="44%" cy="35%" r="70%"><stop stop-color="#fdfdfa"/><stop offset=".67" stop-color="#f7f8f2"/><stop offset=".9" stop-color="#e9eee4"/><stop offset="1" stop-color="#dae0d5"/></radialGradient>
  <linearGradient id="bevel" x1=".12" y1="0" x2=".8" y2="1"><stop stop-color="#cbd3c6"/><stop offset=".39" stop-color="#e8ede2"/><stop offset=".69" stop-color="#fffefa"/><stop offset="1" stop-color="#fffffc"/></linearGradient>
  <linearGradient id="rimlight" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#fafbf6" stop-opacity=".35"/><stop offset="1" stop-color="#fafbf6" stop-opacity="0"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64897b"/><stop offset=".32" stop-color="#466c5d"/><stop offset="1" stop-color="#23493d"/></linearGradient>
  <linearGradient id="jade-front" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#6b9280"/><stop offset=".42" stop-color="#426c58"/><stop offset="1" stop-color="#244c3d"/></linearGradient>
  <linearGradient id="jade-left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84a595"/><stop offset="1" stop-color="#4f7a67"/></linearGradient>
  <linearGradient id="pivot" x1=".12" y1="0" x2=".85" y2="1"><stop stop-color="#fffefa"/><stop offset=".38" stop-color="#eff3e9"/><stop offset="1" stop-color="#cbd8c8"/></linearGradient>
  <radialGradient id="pivot-inner" cx="30%" cy="27%" r="86%"><stop stop-color="#fbfdf7"/><stop offset=".72" stop-color="#e6eee0"/><stop offset="1" stop-color="#a9bcaa"/></radialGradient>
  <filter id="papergrain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="27"/></filter>
  <filter id="contact-shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="pointer-shadow" x="-80%" y="-30%" width="260%" height="170%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="bowlclip"><circle cx="600" cy="600" r="365"/></clipPath>
  <g id="tick"><path d="M600 200V213" stroke="#8ba494" stroke-width="2.8" stroke-linecap="round"/><path d="M590 211H610" stroke="#aebcaf" stroke-width=".7" opacity=".7"/></g>
</defs>
