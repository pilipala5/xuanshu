    <path d="M393 487C354 443 341 414 325 391M486 389C523 390 533 380 558 366M557 274C591 224 620 206 650 187" stroke="#8e9587" stroke-opacity=".25" stroke-width="1.6"/>
  </g>
  <!-- Sparse ink leaves, sculpted along the branch rather than a repetitive halo. -->
  <g fill="url(#leaf)" stroke="#334a3f" stroke-width=".7">
    <path d="M326 685C311 647 278 635 254 627C268 657 294 685 326 685Z"/>
    <path d="M402 464C390 437 394 410 405 386C422 419 419 445 402 464Z"/>
    <path d="M527 594C550 566 577 563 603 568C578 590 555 600 527 594Z"/>
    <path d="M620 235C598 218 587 194 589 167C617 184 631 207 620 235Z"/>
    <path d="M297 964C311 943 333 934 354 935C341 961 320 971 297 964Z"/>
  </g>
  <g fill="none" stroke="#9dafa0" stroke-opacity=".35" stroke-width="1">
    <path d="M324 682L265 638M402 458L404 397M536 590L592 572M618 229L595 179M303 960L344 941"/>
  </g>
  <!-- Five blooms of different scale and viewpoint, individually oriented. -->
  <use href="#bloom" transform="translate(383 540) rotate(-21) scale(1.28)"/>
  <use href="#sideBloom" transform="translate(538 365) rotate(18) scale(.95)"/>
  <use href="#bloom" transform="translate(598 245) rotate(13) scale(.84)"/>
  <use href="#bloom" transform="translate(293 746) rotate(40) scale(.69)"/>
  <use href="#sideBloom" transform="translate(475 600) rotate(-27) scale(.84)"/>
  <!-- Unopened buds and their short sepals. -->
  <g>
    <path d="M660 180L696 153M306 379L280 355M533 205L532 173M654 530L690 518" fill="none" stroke="#46514a" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(701 145) rotate(35)"><path d="M-12 12C-28-1-20-27-7-30C8-34 24-12 15 4C11 13 4 18-12 12Z" fill="url(#bud)" stroke="#bf9687" stroke-width=".8"/><path d="M-11 9L-15 20 0 19 11 8 1 12Z" fill="#4b5544"/><path d="M-6-26C1-16 3-4 0 10" fill="none" stroke="#a36c66" stroke-opacity=".5" stroke-width="1"/></g>
    <g transform="translate(273 349) rotate(-48) scale(.88)"><path d="M-12 12C-26-3-20-24-7-29C8-34 23-13 15 4C10 15 1 18-12 12Z" fill="url(#bud)"/><path d="M-12 7L-16 19 0 20 12 8 0 12Z" fill="#4b5544"/></g>
    <g transform="translate(531 166) rotate(-10) scale(.64)"><path d="M-12 12C-26-3-20-24-7-29C8-34 23-13 15 4C10 15 1 18-12 12Z" fill="url(#bud)"/><path d="M-12 7L-16 19 0 20 12 8 0 12Z" fill="#4b5544"/></g>
    <g transform="translate(698 514) rotate(78) scale(.72)"><path d="M-12 12C-26-3-20-24-7-29C8-34 23-13 15 4C10 15 1 18-12 12Z" fill="url(#bud)"/><path d="M-12 7L-16 19 0 20 12 8 0 12Z" fill="#4b5544"/></g>
  </g>
  <!-- Fallen petal, a quiet foreground detail. -->
  <path d="M493 925C478 911 479 894 496 895C512 896 528 912 527 927C516 932 504 931 493 925Z" fill="url(#petalB)" stroke="#ddc4b8" stroke-width=".7" transform="rotate(18 503 914)"/>
  <path d="M491 902C503 909 513 916 521 925" fill="none" stroke="#fffaf0" stroke-width="1.2"/>
  <!-- Six exact yao rows: 水火既济, top to bottom yin, yang, yin, yang, yin, yang. -->
  <g fill="#3a4943" transform="translate(846 772)">
    <rect x="0" y="0" width="63" height="9" rx=".6"/><rect x="86" y="0" width="63" height="9" rx=".6"/>
    <rect x="0" y="30" width="149" height="9" rx=".6"/>
    <rect x="0" y="60" width="63" height="9" rx=".6"/><rect x="86" y="60" width="63" height="9" rx=".6"/>
