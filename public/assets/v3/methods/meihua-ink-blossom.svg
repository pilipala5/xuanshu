<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">墨枝梅花</title>
  <desc id="desc">斜伸的墨色梅枝上绽开白粉梅花，花瓣有立体的浮雕光影，暖白留白中右下排列精确六爻，旁有一枚朱红小印。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset=".65" stop-color="#f4f0e6"/><stop offset="1" stop-color="#ede9df"/></linearGradient>
    <radialGradient id="wash" cx=".25" cy=".36" r=".6"><stop stop-color="#e0dbce" stop-opacity=".4"/><stop offset="1" stop-color="#e0dbce" stop-opacity="0"/></radialGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#182523"/><stop offset=".45" stop-color="#344441"/><stop offset=".62" stop-color="#1c2c29"/><stop offset="1" stop-color="#68716b"/></linearGradient>
    <linearGradient id="petalA" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#fffef9"/><stop offset=".32" stop-color="#fffcf6"/><stop offset=".66" stop-color="#f0dfda"/><stop offset="1" stop-color="#cfaba5"/></linearGradient>
    <linearGradient id="petalB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffcf5"/><stop offset=".47" stop-color="#f8e9e4"/><stop offset=".8" stop-color="#e6c5c0"/><stop offset="1" stop-color="#c79691"/></linearGradient>
    <linearGradient id="petalC" x1=".1" y1="1" x2=".95" y2="0"><stop stop-color="#b98e86"/><stop offset=".4" stop-color="#f2dcd4"/><stop offset=".78" stop-color="#fff9f1"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3e9"/><stop offset=".3" stop-color="#e7c0b5"/><stop offset=".7" stop-color="#c0847b"/><stop offset="1" stop-color="#6c4c47"/></linearGradient>
    <radialGradient id="flowerHeart"><stop stop-color="#70594a"/><stop offset=".45" stop-color="#b49572"/><stop offset=".85" stop-color="#d3b898"/><stop offset="1" stop-color="#a6896d"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#708379"/><stop offset=".5" stop-color="#374a44"/><stop offset="1" stop-color="#1d302a"/></linearGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="33"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <filter id="branchGrain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="8"/><feColorMatrix values=".2 0 0 0 .15 0 .2 0 0 .18 0 0 .2 0 .16 0 0 0 .14 0"/><feComposite in2="SourceAlpha" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <filter id="flowerShadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="6" dy="10" stdDeviation="5" flood-color="#534c42" flood-opacity=".21"/></filter>
    <filter id="petalShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#967a70" flood-opacity=".2"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="inkBlur"><feGaussianBlur stdDeviation="1.1"/></filter>
    <g id="petal">
      <path d="M0 13C-19 1-45-21-48-48C-51-70-37-89-19-90C-2-91 6-80 10-75C21-87 42-90 55-78C75-58 64-31 47-16C33-3 15 5 0 13Z" fill="url(#petalA)" stroke="#d7b8ae" stroke-width=".65"/>
      <path d="M1 5C-6-19-5-38-17-67M3 2C16-19 35-31 41-57" fill="none" stroke="#d7b7af" stroke-width=".8" stroke-opacity=".62"/>
      <path d="M-35-47C-34-71-20-81-8-79M25-75C42-83 56-69 58-58" fill="none" stroke="#fffef8" stroke-width="3" stroke-linecap="round" stroke-opacity=".83"/>
    </g>
    <g id="stamens" fill="none" stroke="#937a58" stroke-width="1.1" stroke-linecap="round">
      <path d="M0 0L-34-18M0 0L-28-34M0 0L-12-42M0 0L8-39M0 0L28-33M0 0L39-13M0 0L36 9M0 0L22 30M0 0L1 37M0 0L-22 30M0 0L-35 10M0 0L-17-22M0 0L14-22M0 0L21 12M0 0L-10 23"/>
      <g fill="#c7a365" stroke="#8f734d" stroke-width=".75"><circle cx="-34" cy="-18" r="3"/><circle cx="-28" cy="-34" r="3"/><circle cx="-12" cy="-42" r="2.8"/><circle cx="8" cy="-39" r="3"/><circle cx="28" cy="-33" r="3"/><circle cx="39" cy="-13" r="3.2"/><circle cx="36" cy="9" r="2.7"/><circle cx="22" cy="30" r="3"/><circle cx="1" cy="37" r="2.7"/><circle cx="-22" cy="30" r="3"/><circle cx="-35" cy="10" r="3.1"/><circle cx="-17" cy="-22" r="2.5"/><circle cx="14" cy="-22" r="2.4"/><circle cx="21" cy="12" r="2.5"/><circle cx="-10" cy="23" r="2.5"/></g>
      <circle r="12" fill="url(#flowerHeart)" stroke="#c3a88a" stroke-width=".8"/>
      <circle cx="-3" cy="-3" r="4" fill="#d2b898" stroke="none" opacity=".7"/>
    </g>
    <g id="bloom" filter="url(#flowerShadow)">
      <g filter="url(#petalShadow)"><use href="#petal" transform="rotate(-8)"/><use href="#petal" transform="rotate(64)"/><use href="#petal" transform="rotate(136)"/><use href="#petal" transform="rotate(208)"/><use href="#petal" transform="rotate(280)"/></g>
      <path d="M-12-7C-16-29-31-39-36-34C-41-30-35-17-16 0M7-10C24-29 37-26 38-18C38-10 25-3 11 2M2 11C9 33 0 39-7 33C-14 26-9 17-4 10" fill="url(#petalB)" opacity=".82"/>
      <use href="#stamens"/>
    </g>
    <g id="sideBloom" filter="url(#flowerShadow)">
      <path d="M-42 20C-72 0-72-41-49-52C-25-62-8-38 0-13C-1-45 19-62 39-55C65-46 61-17 45 6C69-4 83 8 80 27C77 48 44 58 19 49Z" fill="url(#petalC)" stroke="#d1aea4" stroke-width=".8"/>
      <path d="M-29 34C-62 27-72 5-57-8C-40-24-13-14 9 17C1-16 10-43 32-41C56-40 60-12 39 23C65 8 83 20 70 39C60 56 31 64 6 53Z" fill="url(#petalA)" stroke="#dfc3b8" stroke-width=".8"/>
      <path d="M-9 35C-37 26-45 6-29-1C-13-9 5 10 11 33C26 8 45 3 50 18C53 33 34 49 16 50Z" fill="url(#petalB)"/>
      <path d="M-28-34C-12-22-5-8 4 15M26-33C19-16 17-2 15 19" fill="none" stroke="#c99f96" stroke-opacity=".5" stroke-width="1"/>
      <g transform="translate(9 37) scale(.64 .48)"><use href="#stamens"/></g>
      <path d="M-10 48C-6 66 9 71 27 57L16 50Z" fill="#514d3b"/>
    </g>
  </defs>
  <rect width="1200" height="1200" fill="url(#paper)" filter="url(#paperGrain)"/>
  <rect width="1200" height="1200" fill="url(#wash)"/>
  <!-- Broad paper shadow creates relief without filling the right-hand void. -->
  <g fill="none" stroke="#5b6258" opacity=".085" filter="url(#blur)" transform="translate(20 26)">
    <path d="M-70 1130C66 990 178 856 265 714S390 474 528 299S677 146 760 106" stroke-width="32"/>
    <path d="M245 752C351 707 410 633 490 585S582 537 657 527" stroke-width="14"/>
  </g>
