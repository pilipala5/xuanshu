    <path d="M435 637C440 601 422 579 416 550C410 519 416 496 416 482C422 509 421 525 428 546C437 573 457 600 449 626Z"/>
    <path d="M219 881C231 904 265 924 284 958C299 986 311 1009 321 1037C300 1009 291 990 272 964C252 938 228 923 206 901Z"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M1 1110C79 1023 133 943 187 874C244 800 278 740 319 649C353 573 388 473 460 388" stroke="#909088" stroke-opacity=".31" stroke-width="3"/>
    <path d="M90 1045C161 950 171 941 212 884M249 810C273 767 279 741 296 711M332 625C348 573 363 550 375 517M406 447C445 390 469 371 497 336" stroke="#151e1c" stroke-opacity=".76" stroke-width="4"/>
