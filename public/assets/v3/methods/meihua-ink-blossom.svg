    <rect x="0" y="120" width="63" height="9" rx=".6"/><rect x="86" y="120" width="63" height="9" rx=".6"/>
    <rect x="0" y="150" width="149" height="9" rx=".6"/>
  </g>
  <!-- A small hand-cut red seal; no caption or slogan. -->
