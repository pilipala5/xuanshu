    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset=".52" stop-color="#f3eee1"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="light" cx=".25" cy=".13" r=".9"><stop stop-color="#fffef8" stop-opacity=".9"/><stop offset="1" stop-color="#fffef8" stop-opacity="0"/></radialGradient>
    <linearGradient id="jade1" x1="0" y1="0" x2="1" y2=".14"><stop stop-color="#99b8a3"/><stop offset=".1" stop-color="#e2e7d1"/><stop offset=".4" stop-color="#bacdb1"/><stop offset=".78" stop-color="#85a790"/><stop offset="1" stop-color="#618777"/></linearGradient>
    <linearGradient id="jade2" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#c8cdbb"/><stop offset=".12" stop-color="#fffdf0"/><stop offset=".45" stop-color="#e9edda"/><stop offset=".77" stop-color="#d8dfc8"/><stop offset="1" stop-color="#b2bcac"/></linearGradient>
    <linearGradient id="jade3" x1="0" y1="0" x2="1" y2=".23"><stop stop-color="#527f6c"/><stop offset=".1" stop-color="#a5c6b0"/><stop offset=".38" stop-color="#789e83"/><stop offset=".76" stop-color="#527e68"/><stop offset="1" stop-color="#335d50"/></linearGradient>
    <linearGradient id="jade4" x1="0" y1="0" x2="1" y2=".05"><stop stop-color="#a2b4a8"/><stop offset=".14" stop-color="#e7edda"/><stop offset=".48" stop-color="#c0d0ba"/><stop offset=".8" stop-color="#9cbba2"/><stop offset="1" stop-color="#769c88"/></linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5dc"/><stop offset=".4" stop-color="#c0d5ba"/><stop offset="1" stop-color="#638574"/></linearGradient>
    <linearGradient id="whiteTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffff5"/><stop offset="1" stop-color="#bdc5ad"/></linearGradient>
    <linearGradient id="darkEdge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#769980"/><stop offset="1" stop-color="#2e5548"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c5031"/><stop offset=".22" stop-color="#d2aa68"/><stop offset=".46" stop-color="#f1d69c"/><stop offset=".61" stop-color="#a7834b"/><stop offset="1" stop-color="#63452c"/></linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4a3c29"/><stop offset=".3" stop-color="#b89756"/><stop offset=".72" stop-color="#775c35"/><stop offset="1" stop-color="#d0ae72"/></linearGradient>
    <radialGradient id="stoneBloom"><stop stop-color="#eff5d9" stop-opacity=".47"/><stop offset="1" stop-color="#eff5d9" stop-opacity="0"/></radialGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".67" numOctaves="3" seed="11"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
